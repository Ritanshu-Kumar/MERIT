[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "merit"
version = "0.1.0"
description = "Market Execution, Risk & Intelligence Testbed for quantitative equity market-making research."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ritanshu" }
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.14"
strict = true